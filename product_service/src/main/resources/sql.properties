#PRODUCT
product.insert=INSERT INTO products (stock_keeping_unit, name, description, price, currency, status) VALUES (?, ?, ?, ?, ?, 'ACTIVE')
product.findById=SELECT product_id, stock_keeping_unit, name, description, price, currency, status, created_at, updated_at FROM products WHERE product_id=?
product.update=UPDATE products SET stock_keeping_unit=?, name=?, description=?, price=?, currency=? WHERE product_id=?
product.deactivate=UPDATE products SET status='INACTIVE' WHERE product_id=?

#INVENTORY
inventory.insert=INSERT INTO inventory (product_id, available_qty) VALUES (?, ?)
inventory.findById=SELECT product_id, available_qty FROM inventory WHERE product_id=?
inventory.deduct=UPDATE inventory SET available_qty = available_qty - ? WHERE product_id = ? AND available_qty >= ?
inventory.restore=UPDATE inventory SET available_qty = available_qty + ? WHERE product_id = ?



